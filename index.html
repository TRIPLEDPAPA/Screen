<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>종가배팅 실시간 스캐너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="pb-12">

  <header class="sticky top-0 z-30 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="flex justify-between items-center max-w-4xl mx-auto">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="font-extrabold text-base tracking-tight text-rose-500 flex items-center gap-1.5">
          <i class="fa-solid fa-bolt-lightning"></i> 종가배팅 머니플로우
        </h1>
      </div>
      <button onclick="fetchData()" id="refreshBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1">
        <i class="fa-solid fa-rotate"></i> 새로고침
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-4">

    <div class="grid grid-cols-3 gap-2 text-center text-xs">
      <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
        <span class="text-slate-400 block text-[11px]">외인 동향</span>
        <span id="foreignFlow" class="font-bold text-emerald-400">+1,420억</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
        <span class="text-slate-400 block text-[11px]">기관 동향</span>
        <span id="instFlow" class="font-bold text-rose-400">-580억</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
        <span class="text-slate-400 block text-[11px]">마감 시간</span>
        <span id="clock" class="font-bold text-amber-400">15:15:00</span>
      </div>
    </div>

    <div class="bg-slate-900/60 border border-slate-800 px-3.5 py-2.5 rounded-xl flex items-center justify-between text-xs">
      <span class="text-slate-300">
        <i class="fa-solid fa-filter text-rose-400 mr-1"></i>
        <strong>포착 기준:</strong> 거래대금 300억↑ · 고가대비 -3% 이내
      </span>
      <span id="itemCount" class="text-slate-500 font-medium">0종목 포착</span>
    </div>

    <div id="stockList" class="space-y-3"></div>

  </main>

  <script>
    function updateTime() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
    }
    setInterval(updateTime, 1000);
    updateTime();

    async function fetchData() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('opacity-50');
      
      try {
        const res = await fetch('/api/closing-bets');
        const data = await res.json();
        
        document.getElementById('foreignFlow').innerText = data.market.foreign;
        document.getElementById('instFlow').innerText = data.market.inst;
        document.getElementById('itemCount').innerText = `${data.items.length}종목 포착`;
        
        renderCards(data.items);
      } catch (err) {
        console.error("데이터 로드 실패:", err);
      } finally {
        btn.classList.remove('opacity-50');
      }
    }

    function renderCards(items) {
      const container = document.getElementById("stockList");
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center text-slate-500 text-sm">
            현재 조건(거래대금 + 고가권 유지)에 만족하는 종목이 없습니다.<br>
            (장 마감 시간 15:00 ~ 15:30에 다시 확인해 보세요)
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm hover:border-slate-700 transition";

        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-base text-white">${item.name}</span>
                <span class="text-xs text-slate-500 font-mono">${item.code}</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-1">${item.reason}</p>
            </div>
            <div class="text-right">
              <span class="inline-block px-2.5 py-1 rounded text-xs font-black bg-rose-500/20 text-rose-400 border border-rose-500/40">
                ${item.score}점
              </span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 bg-slate-950/70 p-2.5 rounded-lg border border-slate-800/80 text-center my-3">
            <div>
              <span class="block text-[10px] text-slate-500">현재가</span>
              <span class="text-xs font-bold text-slate-200">${item.price.toLocaleString()}원</span>
            </div>
            <div>
              <span class="block text-[10px] text-slate-500">등락률</span>
              <span class="text-xs font-bold text-rose-400">${item.change}</span>
            </div>
            <div>
              <span class="block text-[10px] text-slate-500">고가대비 괴리</span>
              <span class="text-xs font-bold text-amber-400">${item.highDiff}</span>
            </div>
          </div>

          <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-800/60">
            <span class="text-slate-400 text-[11px]">거래대금: <strong class="text-slate-200">${item.vol}</strong></span>
            <a href="https://m.stock.naver.com/domestic/stock/${item.code}/total" target="_blank" class="text-[11px] text-rose-400 hover:underline">
              차트 보기 <i class="fa-solid fa-chevron-right text-[9px]"></i>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", fetchData);
  </script>
</body>
</html>
