<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Flow - 통합 퀀트 & DART 공시 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1320; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background-color: #111a2e; border: 1px solid #1e293b; }
        .card-link { transition: all 0.2s; display: block; text-decoration: none; color: inherit; }
        .card-link:hover { border-color: #06b6d4; background-color: #162238; transform: translateY(-2px); }
        .table-container { background-color: #111a2e; border: 1px solid #1e293b; }
        th { background-color: #0d1527; color: #64748b; font-weight: 600; font-size: 0.82rem; white-space: nowrap; }
        td { border-bottom: 1px solid #1e293b; font-size: 0.88rem; white-space: nowrap; }
        tr:hover td { background-color: #162238; }
        .badge-leader { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 9999px; padding: 3px 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .btn-tab { background-color: #132238; color: #94a3b8; border-radius: 9999px; padding: 4px 14px; font-size: 0.8rem; transition: all 0.2s; }
        .btn-tab.active { background-color: #0d9488; color: #ffffff; font-weight: 600; }
        .btn-detail { background-color: #00bcd4; color: #042f2e; font-weight: 600; border-radius: 4px; padding: 4px 12px; font-size: 0.8rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 space-y-6">

    <!-- 상단 네비게이션 탭 -->
    <header class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50 -mx-4 -mt-4 md:-mx-6 md:-mt-6 px-4 md:px-6 h-14 flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 overflow-x-auto no-scrollbar py-2 w-full">
            <span class="text-base font-bold tracking-tight text-cyan-400 shrink-0">⚡ Money Flow</span>
            <nav class="flex gap-4 text-sm font-medium text-slate-300 shrink-0">
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn text-cyan-400 font-semibold pb-1 border-b-2 border-cyan-400 whitespace-nowrap">홈</button>
                <button onclick="switchTab('feed')" id="nav-feed" class="nav-btn hover:text-cyan-400 pb-1 whitespace-nowrap">공시 피드</button>
                <button onclick="switchTab('money')" id="nav-money" class="nav-btn hover:text-cyan-400 pb-1 whitespace-nowrap">MONEY FLOW</button>
                <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn hover:text-cyan-400 pb-1 whitespace-nowrap">MONEY갤린더</button>
                <button onclick="switchTab('buyback')" id="nav-buyback" class="nav-btn hover:text-cyan-400 pb-1 whitespace-nowrap">자사주소각</button>
                <button onclick="switchTab('notice')" id="nav-notice" class="nav-btn hover:text-cyan-400 pb-1 whitespace-nowrap">공지</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full flex-grow space-y-6">

        <!-- [ 홈 탭 ] -->
        <section id="tab-home" class="tab-content space-y-6">
            <div class="card p-4 rounded-xl">
                <div class="text-xs font-bold text-cyan-400 mb-3">📊 주요지표</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-7 gap-2.5 text-center">
                    <div class="card p-3 rounded-lg"><div class="text-[10px] text-gray-400">미국 달러 / 원</div><div class="text-sm font-bold text-white" id="macro-usdkrw">--</div></div>
                    <div class="card p-3 rounded-lg"><div class="text-[10px] text-gray-400">코스피 지수</div><div class="text-sm font-bold text-white" id="macro-kospi">--</div></div>
                    <div class="card p-3 rounded-lg"><div class="text-[10px] text-gray-400">코스닥 지수</div><div class="text-sm font-bold text-white" id="macro-kosdaq">--</div></div>
                    <div class="card p-3 rounded-lg"><div class="text-[10px] text-gray-400">S&P 500</div><div class="text-sm font-bold text-white" id="macro-spx">--</div></div>
                    <div class="card p-3 rounded-lg"><div class="text-[10px] text-gray-400">나스닥종합</div><div class="text-sm font-bold text-white" id="macro-nasdaq">--</div></div>
                    <div class="card p-3 rounded-lg"><div class="text-[10px] text-gray-400">WTI유 선물</div><div class="text-sm font-bold text-white" id="macro-wti">--</div></div>
                    <div class="card p-3 rounded-lg"><div class="text-[10px] text-gray-400">비트코인</div><div class="text-sm font-bold text-white" id="macro-btc">--</div></div>
                </div>
            </div>
        </section>

        <!-- [ DART 공시 피드 탭 ]: 월/일 검색 및 1~5일 즉시 조회 버튼, 키워드 검색 탑재 -->
        <section id="tab-feed" class="tab-content hidden space-y-4">
            <div class="card p-5 rounded-xl shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <h2 class="text-base font-bold text-white">DART 실시간 공시 피드</h2>
                    <span class="text-xs text-emerald-400 font-medium">● DB 연동 고속 검색 활성화</span>
                </div>

                <!-- 검색 및 필터 컨트롤 바 -->
                <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="filterCategory('전체')" id="cat-전체" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-cyan-600 text-white transition">전체</button>
                        <button onclick="filterCategory('주요공시')" id="cat-주요공시" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition">주요공시</button>
                        <button onclick="filterCategory('실적·수주')" id="cat-실적·수주" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition">실적·수주</button>
                        <button onclick="filterCategory('연금관련')" id="cat-연금관련" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition">연금관련</button>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <!-- 월/일 지정 검색 (MM.DD) -->
                        <div class="flex items-center gap-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1">
                            <span class="text-[11px] text-gray-400">📅 월/일:</span>
                            <input type="text" id="search-md" placeholder="예: 09.18" maxlength="5" class="bg-transparent text-xs text-white focus:outline-none w-16" oninput="applyDisclosureFilters()" />
                        </div>

                        <!-- 1일~5일 즉시 조회 버튼 -->
                        <div class="flex gap-1">
                            <button onclick="fetchDays(1)" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-cyan-600 text-gray-300 transition">1일치</button>
                            <button onclick="fetchDays(3)" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-cyan-600 text-gray-300 transition">3일치</button>
                            <button onclick="fetchDays(5)" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-cyan-600 text-gray-300 transition">5일치</button>
                        </div>

                        <!-- 키워드 실시간 검색 -->
                        <div class="relative">
                            <input type="text" id="search-keyword" placeholder="🔍 공시 제목 검색..." oninput="applyDisclosureFilters()" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 w-48" />
                        </div>
                    </div>
                </div>

                <div id="disclosure-list" class="space-y-3 h-[520px] overflow-y-auto pr-1"></div>
            </div>
        </section>

        <!-- [ MONEY FLOW 탭 ]: 퀀트 스크리너 본체 -->
        <section id="tab-money" class="tab-content hidden space-y-6">
            <div class="table-container p-5 rounded-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-white">MONEY FLOW 퀀트 스크리너 (2,500종목 DB 연동)</h2>
                    <span class="text-xs text-cyan-400" id="table-total-count">0종목</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-800">
                                <th class="py-3 px-3">종목명</th>
                                <th class="py-3 px-3 text-center">역할</th>
                                <th class="py-3 px-3 text-center">점수(95)</th>
                                <th class="py-3 px-3 text-right">현재가</th>
                                <th class="py-3 px-3 text-right">등락률</th>
                                <th class="py-3 px-3 text-right">거래대금</th>
                                <th class="py-3 px-3 text-center">분석</th>
                            </tr>
                        </thead>
                        <tbody id="stock-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="tab-calendar" class="tab-content hidden space-y-4"><div class="card p-5 rounded-xl">MONEY갤린더 영역</div></section>
        <section id="tab-buyback" class="tab-content hidden space-y-4"><div class="card p-5 rounded-xl">자사주소각 및 매입 추적 영역</div></section>
        <section id="tab-notice" class="tab-content hidden space-y-4"><div class="card p-5 rounded-xl">공지사항 영역</div></section>

    </main>

    <!-- 상세 모달 -->
    <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="card max-w-2xl w-full rounded-2xl p-6 border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-gray-800 mb-4">
                <h3 class="text-xl font-bold text-white" id="modal-stock-name">종목명</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">✕</button>
            </div>
            <div class="space-y-4 text-xs text-gray-300">
                <div class="font-bold text-cyan-400 text-sm">📈 기간별 수익률 (정밀 매핑)</div>
                <div class="grid grid-cols-7 gap-1 text-center bg-[#142036] p-3 rounded-lg" id="modal-returns-grid"></div>
            </div>
        </div>
    </div>

    <script>
        let rawStocks = [];
        let currentCategory = '전체';
        let currentDaysLimit = 0;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-cyan-400', 'font-semibold', 'border-b-2', 'border-cyan-400');
                el.classList.add('hover:text-cyan-400');
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            const activeNav = document.getElementById('nav-' + tabId);
            if (activeNav) {
                activeNav.classList.remove('hover:text-cyan-400');
                activeNav.classList.add('text-cyan-400', 'font-semibold', 'border-b-2', 'border-cyan-400');
            }
            if (tabId === 'money' || tabId === 'home') fetchDashboardData();
            if (tabId === 'feed') applyDisclosureFilters();
        }

        async function fetchDashboardData() {
            try {
                const res = await fetch('/api/scan');
                const data = await res.json();
                if (data.market) {
                    const m = data.market.macro;
                    for (const [key, obj] of Object.entries(m)) {
                        const el = document.getElementById('macro-' + key);
                        if (el) el.innerHTML = `${obj.val} <span class="${obj.up ? 'text-rose-400' : 'text-sky-400'} text-[10px]">${obj.chg}</span>`;
                    }
                }
                if (data.results) {
                    rawStocks = data.results;
                    document.getElementById('table-total-count').innerText = `총 ${rawStocks.length}개 종목 스캔 완료`;
                    let html = '';
                    rawStocks.forEach(item => {
                        const chg = item.metrics.change_pct;
                        html += `
                            <tr>
                                <td class="py-3 px-3 font-bold text-white">${item.name} <span class="text-[10px] text-slate-500 font-normal">(${item.code})</span></td>
                                <td class="py-3 px-3 text-center"><span class="badge-leader">${item.role}</span></td>
                                <td class="py-3 px-3 text-center font-bold text-cyan-400">${item.score}점</td>
                                <td class="py-3 px-3 text-right text-white font-semibold">${item.metrics.current_price.toLocaleString()}원</td>
                                <td class="py-3 px-3 text-right font-bold ${chg >= 0 ? 'text-rose-400' : 'text-sky-400'}">${chg >= 0 ? '+' : ''}${chg}%</td>
                                <td class="py-3 px-3 text-right text-gray-200">${Math.round(item.metrics.turnover/100000000).toLocaleString()}억</td>
                                <td class="py-3 px-3 text-center"><button onclick="openModal('${item.code}')" class="btn-detail">상세분석</button></td>
                            </tr>
                        `;
                    });
                    document.getElementById('stock-tbody').innerHTML = html;
                }
            } catch (err) { console.error(err); }
        }

        // DART 공시 피드 필터 및 검색 로직
        function filterCategory(cat) {
            currentCategory = cat;
            ['전체', '주요공시', '실적·수주', '연금관련'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (btn) btn.className = c === cat ? "px-3 py-1.5 text-xs font-semibold rounded-lg bg-cyan-600 text-white transition" : "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition";
            });
            applyDisclosureFilters();
        }

        function fetchDays(days) {
            currentDaysLimit = days;
            applyDisclosureFilters();
        }

        async function applyDisclosureFilters() {
            const md = document.getElementById('search-md').value.trim();
            const keyword = document.getElementById('search-keyword').value.trim();
            let url = `/api/disclosures?category=${encodeURIComponent(currentCategory)}`;
            if (md) url += `&month_day=${encodeURIComponent(md)}`;
            if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
            if (currentDaysLimit > 0) url += `&days=${currentDaysLimit}`;

            try {
                const res = await fetch(url);
                const json = await res.json();
                const list = document.getElementById('disclosure-list');
                list.innerHTML = '';
                if (json.data && json.data.length > 0) {
                    json.data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = "flex items-center justify-between p-3 rounded-xl card hover:border-slate-700 transition";
                        div.innerHTML = `
                            <div class="flex items-center gap-3 overflow-hidden">
                                <span class="text-xs text-cyan-400 font-mono font-bold shrink-0">[${item.date_md}]</span>
                                <span class="text-xs text-slate-400 shrink-0">${item.time}</span>
                                <span class="text-[11px] px-2 py-0.5 rounded border shrink-0 ${item.tag_color}">* ${item.tag}</span>
                                <span class="text-xs sm:text-sm font-medium text-slate-200 truncate">${item.title}</span>
                            </div>
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">조건에 일치하는 공시 내역이 없습니다.</div>`;
                }
            } catch (err) { console.error("공시 로드 실패:", err); }
        }

        function openModal(code) {
            const item = rawStocks.find(x => x.code === code);
            if (!item) return;
            document.getElementById('modal-stock-name').innerText = `${item.name} (${item.code})`;
            const mr = item.metrics.modal_returns || {};
            document.getElementById('modal-returns-grid').innerHTML = `
                <div class="bg-[#142036] p-2 rounded">1년<br/>▲ ${mr['1년']}%</div>
                <div class="bg-[#142036] p-2 rounded">6개월<br/>▲ ${mr['6개월']}%</div>
                <div class="bg-[#142036] p-2 rounded">3개월<br/>▲ ${mr['3개월']}%</div>
                <div class="bg-[#142036] p-2 rounded">1개월<br/>▲ ${mr['1개월']}%</div>
                <div class="bg-[#142036] p-2 rounded">20일<br/>▲ ${mr['20일']}%</div>
                <div class="bg-[#142036] p-2 rounded">10일<br/>▲ ${mr['10일']}%</div>
                <div class="bg-[#142036] p-2 rounded">5일<br/>▲ ${mr['5일']}%</div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }

        window.addEventListener('DOMContentLoaded', () => {
            fetchDashboardData();
        });
    </script>
</body>
</html>
