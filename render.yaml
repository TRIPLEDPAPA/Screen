services:
  - type: web
    name: money-flow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: TICK_DEMO
        value: "0"
      - key: KEEPALIVE
        value: always
