<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>연결 확인</title><style>body{background:#08111e;color:#e2e8f0;font:16px sans-serif;max-width:800px;margin:30px auto;padding:16px}button{padding:12px;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>데이터 연결 확인</h1><p>키 값은 표시하지 않습니다. 등록 여부와 실제 조회 성공 여부는 다릅니다.</p><button onclick="load()">설정 상태 확인</button><button onclick="check()">한투 실제 시세 조회</button><pre id="result">확인 전</pre><script>async function show(url){const r=await fetch(url);document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)}function load(){show('/api/readiness')}function check(){show('/api/kis/check')}load()</script></html>
